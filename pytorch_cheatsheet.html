<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PyTorch Tensor 常用方法速查表</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f6f6f4;
    --bg-tertiary: #f0ede8;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-tertiary: #9b9b9b;
    --border: rgba(0,0,0,0.10);
    --border-md: rgba(0,0,0,0.18);
    --radius-md: 8px;
    --radius-lg: 12px;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    --sans: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --bg-secondary: #2c2c2e;
      --bg-tertiary: #3a3a3c;
      --text-primary: #f2f2f7;
      --text-secondary: #aeaeb2;
      --text-tertiary: #636366;
      --border: rgba(255,255,255,0.10);
      --border-md: rgba(255,255,255,0.18);
    }
    .b-create{background:#0c2d4a!important;color:#7dc4f7!important}
    .b-shape{background:#1a2e0d!important;color:#8fcc45!important}
    .b-math{background:#1e1a3f!important;color:#b8b0f5!important}
    .b-stat{background:#3a2500!important;color:#f5b942!important}
    .b-index{background:#3a1200!important;color:#f5834a!important}
    .b-type{background:#0a2a1e!important;color:#4fd4a0!important}
    .b-linalg{background:#2e0a1e!important;color:#f59bbf!important}
    .b-grad{background:#252520!important;color:#b0b0a8!important}
    .b-random{background:#2e0a0a!important;color:#f58080!important}
    mark{background:#5a4a00!important;color:#ffd966!important}
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }
  .page {
    max-width: 1280px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 1.75rem;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 1rem;
  }
  .search-row {
    position: relative;
  }
  .search-row svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    pointer-events: none;
    width: 16px; height: 16px;
  }
  #search {
    width: 100%;
    padding: 10px 14px 10px 38px;
    font-size: 14px;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text-primary);
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-md);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #search:focus {
    border-color: #378ADD;
    box-shadow: 0 0 0 3px rgba(55,138,221,0.15);
  }
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 5px 13px;
    border-radius: 20px;
    border: 0.5px solid var(--border-md);
    background: var(--bg);
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--sans);
    transition: all .12s;
    white-space: nowrap;
  }
  .chip svg { width: 13px; height: 13px; }
  .chip:hover { background: var(--bg-secondary); color: var(--text-primary); }
  .chip.active {
    background: var(--text-primary);
    color: var(--bg);
    border-color: var(--text-primary);
  }
  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .legend-dot {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .count-pill {
    font-size: 12px;
    color: var(--text-tertiary);
    background: var(--bg-secondary);
    padding: 3px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
  }
  .table-wrap {
    width: 100%;
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--bg);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  col.c-fn  { width: 17%; }
  col.c-cat { width: 9%; }
  col.c-sig { width: 30%; }
  col.c-desc{ width: 44%; }
  thead tr {
    background: var(--bg-secondary);
    border-bottom: 0.5px solid var(--border-md);
  }
  thead th {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: .07em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: left;
  }
  .group-hdr td {
    background: var(--bg-secondary);
    border-bottom: 0.5px solid var(--border);
    padding: 7px 14px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .group-hdr td span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .group-hdr svg { width: 13px; height: 13px; }
  tbody tr.data-row {
    border-bottom: 0.5px solid var(--border);
    transition: background .1s;
  }
  tbody tr.data-row:last-child { border-bottom: none; }
  tbody tr.data-row:hover { background: var(--bg-secondary); }
  td { padding: 10px 14px; vertical-align: top; overflow: hidden; }
  .fn-name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    word-break: break-all;
    line-height: 1.5;
  }
  .sig-text {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.6;
    word-break: break-all;
    margin-top: 4px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge svg { width: 11px; height: 11px; }
  .b-create { background: #E6F1FB; color: #0C447C; }
  .b-shape  { background: #EAF3DE; color: #27500A; }
  .b-math   { background: #EEEDFE; color: #3C3489; }
  .b-stat   { background: #FAEEDA; color: #633806; }
  .b-index  { background: #FAECE7; color: #712B13; }
  .b-type   { background: #E1F5EE; color: #085041; }
  .b-linalg { background: #FBEAF0; color: #72243E; }
  .b-grad   { background: #F1EFE8; color: #444441; }
  .b-random { background: #FCEBEB; color: #791F1F; }
  .desc-text {
    font-size: 13px;
    color: var(--text-primary);
    line-height: 1.6;
  }
  .scene-text {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-top: 5px;
    display: flex;
    align-items: flex-start;
    gap: 5px;
  }
  .scene-text svg { width: 12px; height: 12px; flex-shrink: 0; margin-top: 2px; }
  .empty {
    text-align: center;
    padding: 4rem;
    color: var(--text-tertiary);
    font-size: 14px;
  }
  mark {
    background: #FDE68A;
    color: #633806;
    border-radius: 2px;
    padding: 0 2px;
  }
  @media (max-width: 768px) {
    col.c-fn  { width: 30%; }
    col.c-cat { width: 0; display: none; }
    col.c-sig { width: 0; display: none; }
    col.c-desc{ width: 70%; }
    .hide-mobile { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>PyTorch Tensor 常用方法速查表</h1>
    <p class="subtitle">170+ 个方法 · 9 大分类 · 支持搜索与筛选</p>
  </header>
 
  <div class="toolbar">
    <div class="search-row">

</div>
 
<script>
const ICON = {
  search:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>`,
  list:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,

const CATS = {
  create: { label:"创建",      icon:"plus",     cls:"b-create", dot:"#378ADD" },
  shape:  { label:"形状变换",  icon:"resize",   cls:"b-shape",  dot:"#639922" },
  math:   { label:"数学运算",  icon:"math",     cls:"b-math",   dot:"#7F77DD" },
  stat:   { label:"统计聚合",  icon:"chart",    cls:"b-stat",   dot:"#BA7517" },

  random: { label:"随机采样",  icon:"dice",     cls:"b-random", dot:"#E24B4A" },

const DATA = [
  // 创建
  {fn:"torch.tensor()",cat:"create",sig:"torch.tensor(data, dtype=None, device=None, requires_grad=False)",desc:"从 Python list / numpy array 直接创建张量",scene:"最常用的手动创建方式，调试时构造小数据"},

  {fn:"torch.zeros_like()",cat:"create",sig:"torch.zeros_like(input, dtype=None, device=None)",desc:"创建与 input 形状和 dtype 相同的全 0 张量",scene:"梯度归零、结果占位"},
  {fn:"torch.ones_like()",cat:"create",sig:"torch.ones_like(input, dtype=None, device=None)",desc:"创建与 input 形状和 dtype 相同的全 1 张量",scene:"快速生成同形状掩码"},
  {fn:"torch.full_like()",cat:"create",sig:"torch.full_like(input, fill_value, dtype=None)",desc:"创建与 input 形状相同并填充指定值的张量",scene:"批量初始化同形状张量"},
  {fn:"torch.empty()",cat:"create",sig:"torch.empty(*size, dtype=None, device=None)",desc:"分配未初始化内存，速度最快但值随机",scene:"性能敏感场景，确保后续会覆盖所有值"},
  {fn:"torch.empty_like()",cat:"create",sig:"torch.empty_like(input)",desc:"创建与 input 形状相同的未初始化张量",scene:"需要快速分配同形缓冲区时"},
  {fn:"torch.arange()",cat:"create",sig:"torch.arange(start=0, end, step=1, dtype=None)",desc:"生成等差序列（不含 end）",scene:"生成位置索引、时间步序列"},
  {fn:"torch.linspace()",cat:"create",sig:"torch.linspace(start, end, steps, dtype=None)",desc:"在 [start, end] 之间生成 steps 个等间隔点（含两端）",scene:"绘图 x 轴、插值采样点"},
  {fn:"torch.logspace()",cat:"create",sig:"torch.logspace(start, end, steps, base=10.0)",desc:"在对数尺度上生成等间隔点",scene:"学习率 warmup、频率坐标轴"},

  {fn:"torch.from_numpy()",cat:"create",sig:"torch.from_numpy(ndarray)",desc:"从 NumPy 数组创建张量（共享内存，零拷贝）",scene:"与 NumPy / OpenCV 生态互操作"},
  {fn:"torch.as_tensor()",cat:"create",sig:"torch.as_tensor(data, dtype=None, device=None)",desc:"将数据转换为张量，尽量避免复制（共享内存）",scene:"比 torch.tensor() 更高效的转换方式"},
  {fn:"torch.frombuffer()",cat:"create",sig:"torch.frombuffer(buffer, dtype, count=-1, offset=0)",desc:"从实现了 buffer 协议的对象（如 bytes）创建张量",scene:"读取二进制数据流、自定义文件格式解析"},
  {fn:"torch.sparse_coo_tensor()",cat:"create",sig:"torch.sparse_coo_tensor(indices, values, size)",desc:"创建 COO 格式稀疏张量",scene:"图神经网络邻接矩阵、大规模稀疏特征"},

  {fn:".t()",cat:"shape",sig:"t.t()",desc:"二维矩阵转置快捷方式，等价于 .transpose(0,1)",scene:"快速转置权重矩阵"},

let activeFilter = "all", searchVal = "";
 
function svgIcon(name) { return ICON[name] || ""; }
 
const chipsEl = document.getElementById("chips");
const legendEl = document.getElementById("legend");
 
const allBtn = document.createElement("button");
allBtn.className = "chip active"; allBtn.dataset.key = "all";
allBtn.innerHTML = svgIcon("list") + " 全部";
chipsEl.appendChild(allBtn);
 
const CAT_ICONS = { create:"plus", shape:"resize", math:"math", stat:"chart", index:"cut", type:"transfer", linalg:"calc", grad:"grad", random:"dice" };
 
Object.entries(CATS).forEach(([key, c]) => {
  const btn = document.createElement("button");
  btn.className = "chip"; btn.dataset.key = key;
  btn.innerHTML = svgIcon(CAT_ICONS[key]) + " " + c.label;
  chipsEl.appendChild(btn);
  const dot = document.createElement("span");
  dot.className = "legend-dot";
  dot.innerHTML = `<span class="dot" style="background:${c.dot}"></span>${c.label}`;
  legendEl.appendChild(dot);
});
 
chipsEl.addEventListener("click", e => {
  const btn = e.target.closest(".chip");
  if (!btn) return;
  activeFilter = btn.dataset.key;
  chipsEl.querySelectorAll(".chip").forEach(b => b.classList.toggle("active", b === btn));
  render();
});
 
document.getElementById("search").addEventListener("input", e => {
  searchVal = e.target.value; render();
});
 
function hl(str, q) {
  if (!q) return str;
  const re = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
  return str.replace(re, '<mark>$1</mark>');
}
 
function render() {
  const q = searchVal.toLowerCase().trim();
  const rows = DATA.filter(d => {
    const mc = activeFilter === "all" || d.cat === activeFilter;
    const mq = !q || d.fn.toLowerCase().includes(q) || d.desc.toLowerCase().includes(q) || d.scene.toLowerCase().includes(q) || CATS[d.cat].label.includes(q);
    return mc && mq;
  });
  document.getElementById("count").textContent = `${rows.length} / ${DATA.length} 个方法`;
  const tb = document.getElementById("tbody");
  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="4" class="empty">${svgIcon("sad")}<br>没有匹配的方法</td></tr>`;
    return;
  }
  const grouped = activeFilter === "all" && !q;
  let html = "", lastCat = null;
  rows.forEach(d => {
    if (grouped && d.cat !== lastCat) {
      const c = CATS[d.cat];
      html += `<tr class="group-hdr"><td colspan="4"><span>${svgIcon(CAT_ICONS[d.cat])} ${c.label}</span></td></tr>`;
      lastCat = d.cat;
    }
    const c = CATS[d.cat];
    html += `<tr class="data-row">
      <td><div class="fn-name">${hl(d.fn, searchVal)}</div></td>
      <td class="hide-mobile"><span class="badge ${c.cls}">${svgIcon(CAT_ICONS[d.cat])} ${c.label}</span></td>
      <td class="hide-mobile"><div class="sig-text">${hl(d.sig, searchVal)}</div></td>
      <td>
        <div class="desc-text">${hl(d.desc, searchVal)}</div>
        <div class="scene-text">${svgIcon("bulb")} ${hl(d.scene, searchVal)}</div>
      </td>
    </tr>`;
  });
  tb.innerHTML = html;
}

render();
</script>
