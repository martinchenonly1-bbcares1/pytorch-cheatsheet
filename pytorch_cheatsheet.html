<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PyTorch 常用方法速查表</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f6f6f4;
    --bg-tertiary: #f0ede8;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-tertiary: #9b9b9b;
    --border: rgba(0,0,0,0.10);
    --border-md: rgba(0,0,0,0.18);
    --radius-md: 8px;
    --radius-lg: 12px;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
    --sans: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --bg-secondary: #2c2c2e;
      --bg-tertiary: #3a3a3c;
      --text-primary: #f2f2f7;
      --text-secondary: #aeaeb2;
      --text-tertiary: #636366;
      --border: rgba(255,255,255,0.10);
      --border-md: rgba(255,255,255,0.18);
    }
    .b-create{background:#0c2d4a!important;color:#7dc4f7!important}
    .b-shape{background:#1a2e0d!important;color:#8fcc45!important}
    .b-math{background:#1e1a3f!important;color:#b8b0f5!important}
    .b-stat{background:#3a2500!important;color:#f5b942!important}
    .b-index{background:#3a1200!important;color:#f5834a!important}
    .b-type{background:#0a2a1e!important;color:#4fd4a0!important}
    .b-linalg{background:#2e0a1e!important;color:#f59bbf!important}
    .b-grad{background:#252520!important;color:#b0b0a8!important}
    .b-random{background:#2e0a0a!important;color:#f58080!important}
    .b-nn{background:#2b1238!important;color:#d9a6f2!important}
    .b-data{background:#062b2f!important;color:#61d9e6!important}
    .b-transform{background:#291740!important;color:#d7adff!important}
    .b-train{background:#2f2206!important;color:#f2c261!important}
    .b-deploy{background:#082b29!important;color:#5fe0d3!important}
    mark{background:#5a4a00!important;color:#ffd966!important}
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    background: var(--bg-tertiary);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 2rem 1rem 4rem;
  }
  .page {
    max-width: 1280px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 1.75rem;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--text-secondary);
  }
  .toolbar {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 1rem;
  }
  .search-row {
    position: relative;
  }
  .search-row svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-tertiary);
    pointer-events: none;
    width: 16px; height: 16px;
  }
  #search {
    width: 100%;
    padding: 10px 14px 10px 38px;
    font-size: 14px;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text-primary);
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-md);
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #search:focus {
    border-color: #378ADD;
    box-shadow: 0 0 0 3px rgba(55,138,221,0.15);
  }
  .chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 5px 13px;
    border-radius: 20px;
    border: 0.5px solid var(--border-md);
    background: var(--bg);
    color: var(--text-secondary);
    cursor: pointer;
    font-family: var(--sans);
    transition: all .12s;
    white-space: nowrap;
  }
  .chip svg { width: 13px; height: 13px; }
  .chip:hover { background: var(--bg-secondary); color: var(--text-primary); }
  .chip.active {
    background: var(--text-primary);
    color: var(--bg);
    border-color: var(--text-primary);
  }
  .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .legend-dot {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-secondary);
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .count-pill {
    font-size: 12px;
    color: var(--text-tertiary);
    background: var(--bg-secondary);
    padding: 3px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--border);
  }
  .table-wrap {
    width: 100%;
    border: 0.5px solid var(--border-md);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--bg);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  col.c-fn  { width: 17%; }
  col.c-cat { width: 9%; }
  col.c-sig { width: 30%; }
  col.c-desc{ width: 44%; }
  thead tr {
    background: var(--bg-secondary);
    border-bottom: 0.5px solid var(--border-md);
  }
  thead th {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-tertiary);
    letter-spacing: .07em;
    text-transform: uppercase;
    padding: 10px 14px;
    text-align: left;
  }
  .group-hdr td {
    background: var(--bg-secondary);
    border-bottom: 0.5px solid var(--border);
    padding: 7px 14px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .group-hdr td span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .group-hdr svg { width: 13px; height: 13px; }
  tbody tr.data-row {
    border-bottom: 0.5px solid var(--border);
    transition: background .1s;
  }
  tbody tr.data-row:last-child { border-bottom: none; }
  tbody tr.data-row:hover { background: var(--bg-secondary); }
  td { padding: 10px 14px; vertical-align: top; overflow: hidden; }
  .fn-name {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    color: var(--text-primary);
    word-break: break-all;
    line-height: 1.5;
  }
  .sig-text {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-secondary);
    line-height: 1.6;
    word-break: break-all;
    margin-top: 4px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge svg { width: 11px; height: 11px; }
  .b-create { background: #E6F1FB; color: #0C447C; }
  .b-shape  { background: #EAF3DE; color: #27500A; }
  .b-math   { background: #EEEDFE; color: #3C3489; }
  .b-stat   { background: #FAEEDA; color: #633806; }
  .b-index  { background: #FAECE7; color: #712B13; }
  .b-type   { background: #E1F5EE; color: #085041; }
  .b-linalg { background: #FBEAF0; color: #72243E; }
  .b-grad   { background: #F1EFE8; color: #444441; }
  .b-random { background: #FCEBEB; color: #791F1F; }
  .b-nn     { background: #F3E8FA; color: #5B2375; }
  .b-data   { background: #DFF5F7; color: #07515B; }
  .b-transform { background: #F1E6FF; color: #573184; }
  .b-train { background: #FFF2D5; color: #6B4300; }
  .b-deploy { background: #DDF6F2; color: #0A5953; }
  .desc-text {
    font-size: 13px;
    color: var(--text-primary);
    line-height: 1.6;
  }
  .scene-text {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-top: 5px;
    display: flex;
    align-items: flex-start;
    gap: 5px;
  }
  .scene-text svg { width: 12px; height: 12px; flex-shrink: 0; margin-top: 2px; }
  .empty {
    text-align: center;
    padding: 4rem;
    color: var(--text-tertiary);
    font-size: 14px;
  }
  mark {
    background: #FDE68A;
    color: #633806;
    border-radius: 2px;
    padding: 0 2px;
  }
  @media (max-width: 768px) {
    col.c-fn  { width: 30%; }
    col.c-cat { width: 0; display: none; }
    col.c-sig { width: 0; display: none; }
    col.c-desc{ width: 70%; }
    .hide-mobile { display: none; }
  }

  /* ── 模式切换 Tab ── */
.mode-tabs{display:flex;background:var(--bg-secondary);border:0.5px solid var(--border-md);border-radius:9px;padding:3px;gap:2px;margin-bottom:10px}
.mode-tab{font-size:12px;font-weight:500;font-family:var(--sans);padding:5px 14px;border-radius:7px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;transition:all .15s;white-space:nowrap}
.mode-tab:hover{color:var(--text-primary)}
.mode-tab.active{background:var(--text-primary);color:var(--bg);box-shadow:0 1px 4px rgba(0,0,0,.18)}

/* ── 星标 ── */
:root{--star:#D97706;--star-bg:#FEF3C7;--star-border:#FDE68A}
@media(prefers-color-scheme:dark){:root{--star:#FBBF24;--star-bg:#1a1200;--star-border:#443308}}
.fn-cell{display:flex;align-items:flex-start;gap:5px}
.star-icon{color:var(--star);flex-shrink:0;line-height:1.5;font-size:11px}
.chip.star-chip{border-color:var(--star-border);background:var(--star-bg);color:var(--star)}
.chip.star-chip.active,.chip.star-chip:hover{background:var(--star);color:#fff;border-color:var(--star)}
tr.is-starred{border-left:2px solid var(--star-border)}

/* ── 复制按钮 ── */
.sig-wrap{position:relative}
.copy-btn{position:absolute;top:0;right:0;opacity:0;background:var(--bg);border:0.5px solid var(--border-md);border-radius:5px;padding:2px 7px;cursor:pointer;font-size:11px;color:var(--text-secondary);font-family:var(--sans);transition:opacity .15s;white-space:nowrap}
.copy-btn:hover{color:#378ADD}
tr.data-row:hover .copy-btn{opacity:1}

/* ── Toast 提示 ── */
.toast-box{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(14px);background:#1c1c1e;color:#f2f2f7;font-size:13px;padding:7px 18px;border-radius:20px;box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:all .2s;z-index:9999}
.toast-box.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 场景 Banner ── */
.scene-info{display:none;font-size:12px;color:var(--text-secondary);padding:6px 12px;background:var(--bg-secondary);border:0.5px solid var(--border);border-radius:8px;margin-bottom:8px}
.scene-info.visible{display:block}

</style>
</head>
<body>
<div class="page">
  <header>
    <h1>PyTorch 常用方法速查表</h1>
    <p class="subtitle" id="subtitle">支持搜索与筛选</p>
  </header>
 
  <div class="toolbar">
    <div class="search-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="搜索方法名、描述或使用场景…" />
    </div>
    <div class="mode-tabs">
  <button class="mode-tab active" data-mode="cat">按分类</button>
  <button class="mode-tab" data-mode="scene">按场景</button>
</div>
<div class="chips" id="chips"></div>
<div class="scene-info" id="sceneInfo"></div>
  </div>
 
  <div class="meta">
    <div class="legend" id="legend"></div>
    <div class="count-pill" id="count"></div>
  </div>
 
  <div class="table-wrap">
    <table>
      <colgroup><col class="c-fn"><col class="c-cat"><col class="c-sig"><col class="c-desc"></colgroup>
      <thead>
        <tr>
          <th>方法名</th>
          <th class="hide-mobile">分类</th>
          <th class="hide-mobile">格式 / 主要参数</th>
          <th>说明 &amp; 使用场景</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>
<div class="toast-box" id="toast">✓ 已复制</div>
<script>
const ICON = {
  search:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>`,
  list:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
  plus:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
  resize:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>`,
  math:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M9 6l-6 6 6 6M15 6l6 6-6 6"/></svg>`,
  chart:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="13" width="4" height="8"/><rect x="10" y="9" width="4" height="12"/><rect x="17" y="5" width="4" height="16"/></svg>`,
  cut:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>`,
  transfer: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
  calc:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="12" x2="8" y2="12"/><line x1="12" y1="12" x2="12" y2="12"/><line x1="16" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="12" y1="16" x2="12" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg>`,
  grad:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`,
  dice:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="4"/><circle cx="8" cy="8" r="1" fill="currentColor"/><circle cx="16" cy="8" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8" cy="16" r="1" fill="currentColor"/><circle cx="16" cy="16" r="1" fill="currentColor"/></svg>`,
  layers:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 22 7 12 12 2 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>`,
  data:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></svg>`,
  transform:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4V2"/><path d="M15 16v-2"/><path d="M8 9H6"/><path d="M20 9h-2"/><path d="m17.8 6.2 1.4-1.4"/><path d="m10.8 13.2-1.4 1.4"/><path d="m10.8 4.8-1.4-1.4"/><path d="m17.8 11.8 1.4 1.4"/><path d="M4 20l6-6"/><path d="m14 18 6-6"/><path d="M4 14h6v6"/></svg>`,
  train:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
  deploy:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 20h8"/><path d="M12 18v2"/><path d="m8 9 3 3-3 3"/><path d="M13 15h3"/></svg>`,
  bulb:     `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="9" y1="18" x2="15" y2="18"/><line x1="10" y1="22" x2="14" y2="22"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>`,
  sad:      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16 16s-1.5-2-4-2-4 2-4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`,
};
 
const CATS = {
  create: { label:"创建",      icon:"plus",     cls:"b-create", dot:"#378ADD" },
  shape:  { label:"形状变换",  icon:"resize",   cls:"b-shape",  dot:"#639922" },
  math:   { label:"数学运算",  icon:"math",     cls:"b-math",   dot:"#7F77DD" },
  stat:   { label:"统计聚合",  icon:"chart",    cls:"b-stat",   dot:"#BA7517" },
  index:  { label:"索引切片",  icon:"cut",      cls:"b-index",  dot:"#D85A30" },
  type:   { label:"类型转换",  icon:"transfer", cls:"b-type",   dot:"#1D9E75" },
  linalg: { label:"线性代数",  icon:"calc",     cls:"b-linalg", dot:"#D4537E" },
  grad:   { label:"自动微分",  icon:"grad",     cls:"b-grad",   dot:"#888780" },
  random: { label:"随机采样",  icon:"dice",     cls:"b-random", dot:"#E24B4A" },
  nn:     { label:"神经网络",  icon:"layers",   cls:"b-nn",     dot:"#9B4CC2" },
  data:   { label:"数据加载",  icon:"data",     cls:"b-data",   dot:"#18A6B6" },
  transform: { label:"图像变换", icon:"transform", cls:"b-transform", dot:"#8A57C8" },
  train:  { label:"训练工具",  icon:"train",    cls:"b-train",  dot:"#D79816" },
  deploy: { label:"部署调试",  icon:"deploy",   cls:"b-deploy", dot:"#18A69B" },
};
// ── 星标函数集合 ─────────────────────────────────
const STARRED = new Set([
  // 创建
  "torch.tensor()","torch.zeros()","torch.ones()","torch.arange()",
  "torch.linspace()","torch.eye()","torch.from_numpy()",
  "torch.zeros_like()","torch.ones_like()",
  // 形状
  ".view()",".reshape()",".squeeze()",".unsqueeze()",".permute()",
  ".transpose()","torch.cat()","torch.stack()",".flatten()",".expand()",
  // 数学
  ".add() / +",".mul() / *",".sub() / -","torch.matmul()",".sigmoid()",
  ".exp()",".log()",".clamp()","F.relu()","torch.einsum()",".abs()",
  ".sqrt()",".pow() / **","torch.nan_to_num()","torch.isfinite() / isnan() / isinf()",
  // 统计
  ".sum()",".mean()",".max()",".min()",".argmax()",".std()",
  "torch.topk()","torch.sort() / argsort()",
  // 索引
  "t[i, j, ...]","torch.gather()","torch.where()",
  ".masked_fill()","torch.index_select()",".nonzero()",
  // 类型
  ".to()",".float()",".long()",".numpy()",".item()",
  ".detach()",".clone()",".shape .size()",".dtype .device .layout",".bool()",
  // 线性代数
  "torch.mm()","torch.bmm()","torch.linalg.svd()","torch.dot()",

const chipsEl  = document.getElementById("chips");
const legendEl = document.getElementById("legend");

const CAT_ICONS={create:"plus",shape:"resize",math:"math",stat:"chart",

// 全部按钮
const allBtn=document.createElement("button");
allBtn.className="chip active";allBtn.dataset.key="all";
allBtn.innerHTML=svgIcon("list")+" 全部";
chipsEl.appendChild(allBtn);

// ⭐ 星标按钮（分类模式里也放一个）
const starBtn=document.createElement("button");
starBtn.className="chip star-chip";starBtn.dataset.key="__star__";
starBtn.innerHTML="⭐ 星标";
chipsEl.appendChild(starBtn);

Object.entries(CATS).forEach(([key,c])=>{
  const btn=document.createElement("button");
  btn.className="chip";btn.dataset.key=key;
  btn.innerHTML=svgIcon(CAT_ICONS[key])+" "+c.label;
  chipsEl.appendChild(btn);
  const dot=document.createElement("span");
  dot.className="legend-dot";
  dot.innerHTML=`<span class="dot" style="background:${c.dot}"></span>${c.label}`;
  legendEl.appendChild(dot);
});

// ── 初始化场景 chips（隐藏，插在 chips 后面） ──────
const sceneChipsEl=document.createElement("div");
sceneChipsEl.className="chips";sceneChipsEl.id="sceneChips";
sceneChipsEl.style.display="none";
chipsEl.parentNode.insertBefore(sceneChipsEl,chipsEl.nextSibling);

Object.entries(SCENES).forEach(([key,s])=>{
  const btn=document.createElement("button");
  btn.className="chip";btn.dataset.skey=key;

  sceneChipsEl.appendChild(btn);
});

  tab.addEventListener("click",()=>{
    document.querySelectorAll(".mode-tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    filterMode=tab.dataset.mode;
    if(filterMode==="cat"){
      chipsEl.style.display="";
      sceneChipsEl.style.display="none";
      sceneFn=null;
      document.getElementById("sceneInfo").classList.remove("visible");
    } else {
      chipsEl.style.display="none";
      sceneChipsEl.style.display="";
    }
    activeFilter="all";
    chipsEl.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
    allBtn.classList.add("active");
    sceneChipsEl.querySelectorAll(".chip").forEach(b=>b.classList.remove("active"));
    render();
  });
});

// ── 分类 chips 点击 ───────────────────────────────
chipsEl.addEventListener("click",e=>{
  const btn=e.target.closest(".chip");if(!btn)return;
  activeFilter=btn.dataset.key;
  chipsEl.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b===btn));
  render();
});

// ── 场景 chips 点击 ───────────────────────────────
sceneChipsEl.addEventListener("click",e=>{
  const btn=e.target.closest(".chip");if(!btn)return;
  const skey=btn.dataset.skey;
  sceneChipsEl.querySelectorAll(".chip").forEach(b=>b.classList.toggle("active",b===btn));
  sceneFn=SCENES[skey].match;
  const info=document.getElementById("sceneInfo");
  info.textContent=SCENES[skey].label+" — "+SCENES[skey].desc;
  info.classList.add("visible");
  render();
});

// ── 搜索 ──────────────────────────────────────────
document.getElementById("search").addEventListener("input",e=>{
  searchVal=e.target.value;render();
});

// ── 高亮关键词 ────────────────────────────────────
function hl(str,q){
  if(!q)return str;
  const re=new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")})`,"gi");
  return str.replace(re,"<mark>$1</mark>");
}

// ── 复制 & Toast ──────────────────────────────────
function copyText(text){
  navigator.clipboard.writeText(text).catch(()=>{
    const ta=document.createElement("textarea");
    ta.value=text;document.body.appendChild(ta);ta.select();
    document.execCommand("copy");document.body.removeChild(ta);
  });
  const t=document.getElementById("toast");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1600);
}

// ── 渲染表格 ──────────────────────────────────────
function render(){
  const q=searchVal.toLowerCase().trim();

  let rows=DATA.filter(d=>{
    // 场景模式过滤
    if(filterMode==="scene"&&sceneFn&&!sceneFn(d))return false;
    // 分类模式过滤
    if(filterMode==="cat"){
      if(activeFilter==="__star__"&&!STARRED.has(d.fn))return false;
      if(activeFilter!=="all"&&activeFilter!=="__star__"&&d.cat!==activeFilter)return false;
    }
    // 搜索过滤
    if(q&&!d.fn.toLowerCase().includes(q)&&!d.desc.toLowerCase().includes(q)
      &&!d.scene.toLowerCase().includes(q)&&!CATS[d.cat].label.includes(q))return false;
    return true;
  });

  // 全部视图时星标优先
  const grouped=(filterMode==="cat")&&(activeFilter==="all")&&!q;
  if(grouped){
    rows.sort((a,b)=>{
      if(a.cat!==b.cat)return 0; // 保持原分类顺序
      const sa=STARRED.has(a.fn)?0:1, sb=STARRED.has(b.fn)?0:1;
      return sa-sb;
    });
  }

  const starCount=rows.filter(d=>STARRED.has(d.fn)).length;
  document.getElementById("count").textContent=
    `${rows.length} / ${DATA.length} 个方法${starCount&&starCount<rows.length?" · ⭐ "+starCount:""}`;

  const tb=document.getElementById("tbody");
  if(!rows.length){
    tb.innerHTML=`<tr><td colspan="4" class="empty">${svgIcon("sad")}<br>没有匹配的方法</td></tr>`;
    return;
  }

  let html="", lastCat=null;
  rows.forEach(d=>{
    const isStar=STARRED.has(d.fn);
    if(grouped&&d.cat!==lastCat){
      const c=CATS[d.cat];
      html+=`<tr class="group-hdr"><td colspan="4"><span>${svgIcon(CAT_ICONS[d.cat])} ${c.label}</span></td></tr>`;
      lastCat=d.cat;
    }
    const c=CATS[d.cat];
    const starHtml=isStar?`<span class="star-icon" title="高频常用">★</span>`:"";
    const sigEscaped=(d.sig||"").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    html+=`<tr class="data-row${isStar?" is-starred":""}">
      <td><div class="fn-cell">${starHtml}<div class="fn-name">${hl(d.fn,searchVal)}</div></div></td>
      <td class="hide-mobile"><span class="badge ${c.cls}">${svgIcon(CAT_ICONS[d.cat])} ${c.label}</span></td>
      <td class="hide-mobile"><div class="sig-wrap">
        <div class="sig-text">${hl(sigEscaped,searchVal)}</div>
        <button class="copy-btn" onclick="copyText(${JSON.stringify(d.sig)})">复制</button>
      </div></td>
      <td>
        <div class="desc-text">${hl(d.desc,searchVal)}</div>
        <div class="scene-text">${svgIcon("bulb")} ${hl(d.scene,searchVal)}</div>
      </td>
    </tr>`;
  });
  tb.innerHTML=html;
}

document.getElementById("subtitle").textContent=
  `${DATA.length} 个方法 · ${Object.keys(CATS).length} 大分类 · ⭐ ${STARRED.size} 高频星标`;
render();
</script>
</body>
</html>
